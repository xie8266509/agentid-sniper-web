name: Publish reviewed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed Web version, without v (for example 0.4.0)'
        type: string
        required: true
      commit:
        description: 'Reviewed main commit: full 40-character SHA'
        type: string
        required: true
      reviewed:
        description: 'I reviewed wallet, trading, budget, NFT, dependency and update changes'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify reviewed commit
    if: github.ref == 'refs/heads/main' && github.repository == 'xie8266509/agentid-sniper-web' && inputs.reviewed == true
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Bind approval to the exact current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          node --input-type=module <<'JS'
          const version = process.env.RELEASE_VERSION, commit = process.env.RELEASE_COMMIT;
          if (!/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(version || '') || !/^[a-f0-9]{40}$/.test(commit || '') || commit !== process.env.GITHUB_SHA || process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('Version and exact reviewed main commit are required');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`, { redirect: 'error', signal: AbortSignal.timeout(20000), headers: { accept: 'application/vnd.github+json', authorization: 'Bearer ' + process.env.GH_TOKEN, 'x-github-api-version': '2026-03-10' } });
          if (!response.ok || (await response.json()).object?.sha !== commit) throw new Error('Main changed; review its new commit before publishing');
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          if (JSON.parse(readFileSync('package.json')).version !== version || JSON.parse(readFileSync('release.json')).appVersion !== version) throw new Error('The reviewed version does not match this commit');
          JS
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run release:prepare -- --check
      - run: npm run release:check
  publish:
    name: Publish verified stable tag
    needs: verify
    if: github.ref == 'refs/heads/main' && github.repository == 'xie8266509/agentid-sniper-web' && inputs.reviewed == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    # No checkout, candidate script, npm dependency or downloaded artifact runs
    # in this job. Only this fixed workflow code receives the write token.
    steps:
      - name: Recheck the tested SHA and publish its stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          REVIEWED: ${{ inputs.reviewed }}
        run: |
          node --input-type=module <<'JS'
          const version = process.env.RELEASE_VERSION, commit = process.env.RELEASE_COMMIT, repository = process.env.GITHUB_REPOSITORY;
          if (!/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(version || '') || !/^[a-f0-9]{40}$/.test(commit || '') || repository !== 'xie8266509/agentid-sniper-web' || process.env.GITHUB_REF !== 'refs/heads/main' || process.env.GITHUB_SHA !== commit || process.env.REVIEWED !== 'true' || !/^\d+$/.test(process.env.GITHUB_RUN_ID || '')) throw new Error('Missing exact reviewed release approval');
          const api = async (path, { method = 'GET', body, allow404 = false } = {}) => {
            const response = await fetch('https://api.github.com/repos/' + repository + path, { method, redirect: 'error', signal: AbortSignal.timeout(20000), headers: { accept: 'application/vnd.github+json', authorization: 'Bearer ' + process.env.GH_TOKEN, 'x-github-api-version': '2026-03-10', ...(body === undefined ? {} : { 'content-type': 'application/json' }) }, ...(body === undefined ? {} : { body: JSON.stringify(body) }) });
            if (response.status === 404 && allow404) return null;
            const text = await response.text(); if (text.length > 2 * 1024 * 1024 || !response.ok) throw new Error('GitHub release API failed (' + response.status + ')');
            return JSON.parse(text);
          };
          const run = await api('/actions/runs/' + process.env.GITHUB_RUN_ID);
          if (run.event !== 'workflow_dispatch' || run.head_sha !== commit || run.path !== '.github/workflows/publish-release.yml') throw new Error('Unexpected verification workflow');
          const jobs = await api('/actions/runs/' + process.env.GITHUB_RUN_ID + '/jobs?per_page=100');
          if (!jobs.jobs?.some(job => job.name === 'Verify reviewed commit' && job.status === 'completed' && job.conclusion === 'success')) throw new Error('Exact reviewed commit did not pass verification');
          if ((await api('/git/ref/heads/main')).object?.sha !== commit) throw new Error('Main advanced; the new head needs review');
          const file = async path => {
            const value = await api('/contents/' + path + '?ref=' + commit);
            if (value.encoding !== 'base64' || typeof value.content !== 'string') throw new Error('Invalid committed release file');
            return Buffer.from(value.content, 'base64').toString('utf8');
          };
          const pack = JSON.parse(await file('package.json')), manifest = JSON.parse(await file('release.json')), channel = JSON.parse(await file('release-config.json'));
          if (pack.version !== version || manifest.appVersion !== version || channel.repository !== repository || channel.channel !== 'stable' || channel.upstream?.repository !== 'nancyc0813-maker/agentid-sniper' || channel.upstream?.version !== manifest.upstreamVersion || channel.upstream?.commit !== manifest.upstreamCommit) throw new Error('Published metadata does not match the reviewed commit');
          const changelog = await file('CHANGELOG.md'), marker = '## v' + version + ' ';
          const lines = changelog.split('\n'), start = lines.findIndex(line => line.startsWith(marker));
          if (start < 0) throw new Error('The reviewed version needs a changelog entry');
          let end = start + 1; while (end < lines.length && !lines[end].startsWith('## ')) end++;
          const notes = lines.slice(start + 1, end).join('\n').trim(); if (!notes || notes.length > 50000) throw new Error('Invalid reviewed release notes');
          const tag = 'v' + version, existingTag = await api('/git/ref/tags/' + tag, { allow404: true });
          if (existingTag && (existingTag.object?.type !== 'commit' || existingTag.object?.sha !== commit)) throw new Error('Existing tag points elsewhere; no tag was moved');
          const existingRelease = await api('/releases/tags/' + tag, { allow404: true });
          if (existingRelease) {
            if (existingRelease.draft !== false || existingRelease.prerelease !== false || existingRelease.tag_name !== tag || !existingTag) throw new Error('Existing release is not the verified stable release');
            console.log('Verified stable release already exists: ' + existingRelease.html_url);
          } else {
            const latest = await api('/releases/latest', { allow404: true });
            if (latest) {
              if (!/^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(latest.tag_name || '')) throw new Error('Latest stable tag requires manual review');
              const a = version.split('.').map(BigInt), b = latest.tag_name.slice(1).split('.').map(BigInt); let newer = false;
              for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) { newer = a[i] > b[i]; break; } }
              if (!newer) throw new Error('Refusing to replace a newer or equal stable release');
            }
            if ((await api('/git/ref/heads/main')).object?.sha !== commit) throw new Error('Main changed before publication');
            if (!existingTag) await api('/git/refs', { method: 'POST', body: { ref: 'refs/tags/' + tag, sha: commit } });
            const release = await api('/releases', { method: 'POST', body: { tag_name: tag, target_commitish: commit, name: tag + ' · Agent ID Sniper Web', body: notes + '\n\n固定发行提交：' + commit + '\n\n原作者 [@nancy_c813](https://x.com/nancy_c813) · Web 增强版维护 [@supra_bnb](https://x.com/supra_bnb)。保留 MIT 许可。', draft: false, prerelease: false, make_latest: 'true' } });
            console.log('Published stable release: ' + release.html_url);
          }
          JS
