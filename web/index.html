<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1e2829">
  <title>Agent ID · 多钱包控制台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="#overview" aria-label="Agent ID 总览"><span class="brand-mark">a<span>i</span></span><span>Agent ID<small>多钱包控制台</small></span></a>
      <div class="workspace"><span class="workspace-icon">56</span><div><strong>BNB Smart Chain</strong><span>本地工作空间</span></div><span class="workspace-dot"></span></div>
      <div class="nav-label">工作台</div>
      <nav id="navigation">
        <a class="nav-item active" data-view="overview" href="#overview"><span data-icon="overview"></span><span>总览</span></a>
        <a class="nav-item" data-view="wallets" href="#wallets"><span data-icon="wallet"></span><span>钱包</span><span class="nav-count" id="wallet-count">0</span></a>
        <a class="nav-item" data-view="holdings" href="#holdings"><span data-icon="portfolio"></span><span>持仓</span></a>
        <a class="nav-item" data-view="config" href="#config"><span data-icon="sliders"></span><span>策略</span></a>
        <a class="nav-item" data-view="operations" href="#operations"><span data-icon="terminal"></span><span>手动操作</span></a>
        <a class="nav-item" data-view="logs" href="#logs"><span data-icon="logs"></span><span>日志</span></a>
      </nav>
      <div class="sidebar-bottom">
        <a class="nav-item" data-view="updates" href="#updates"><span data-icon="download"></span><span>版本更新</span><span class="nav-count" id="update-count" hidden></span></a>
        <div class="network-card"><span class="status-dot" id="sidebar-dot"></span><div><strong id="sidebar-service">正在连接</strong><span id="sidebar-mode">本地运行</span></div></div>
        <div class="local-note"><span data-icon="lock"></span>会话与数据保存在本机</div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="切换导航" aria-expanded="false"><span data-icon="menu"></span></button><span>控制台</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-view">总览</strong></div>
        <div class="topbar-right">
          <div class="wallet-scope"><label for="global-wallet">查看范围</label><select id="global-wallet" aria-label="全局钱包筛选"><option value="">全部钱包</option></select><span id="scope-count">0 个钱包</span></div>
          <span class="chain-badge"><span class="status-dot"></span>BSC</span>
          <button class="icon-button" id="global-refresh" aria-label="刷新数据" title="刷新当前数据"><span data-icon="refresh"></span></button>
        </div>
      </header>
      <main id="content" tabindex="-1"><div class="loading-page"><span class="spinner"></span><p>正在读取本地控制台…</p></div></main>
      <footer class="footer">
        <div class="footer-project"><span>Agent ID Sniper <span class="footer-separator">/</span> Web<a id="release-version" href="#updates" title="查看版本与更新"></a></span><nav class="footer-credits" aria-label="项目作者与维护者"><span>原作者 <a href="https://x.com/nancy_c813" target="_blank" rel="noopener noreferrer">@nancy_c813</a></span><span>Web 增强 <a href="https://x.com/supra_bnb" target="_blank" rel="noopener noreferrer">@supra_bnb</a></span></nav></div>
        <span id="updated-at">等待首次同步</span>
      </footer>
    </div>
  </div>
  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-label="操作对话框"><div id="modal-content"></div></dialog>
</body>
</html>
